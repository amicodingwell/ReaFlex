<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — ReaFlex</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070a0f;
      color: #f4f7fb;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(122, 169, 255, 0.12), transparent 28rem),
        #070a0f;
    }
    main {
      width: min(620px, calc(100% - 40px));
      text-align: center;
    }
    span {
      color: #74e2c4;
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0;
      font-size: clamp(3rem, 10vw, 6rem);
      letter-spacing: -.06em;
    }
    p {
      color: #aeb8c6;
    }
    a {
      display: inline-flex;
      margin-top: 16px;
      padding: 11px 16px;
      border-radius: 10px;
      color: #04130f;
      background: #74e2c4;
      font-weight: 850;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <span>404</span>
    <h1>Wrong note.</h1>
    <p>The page you were looking for isn't here.</p>
    <a href="./">Back to ReaFlex</a>
  </main>
</body>
</html>
